name: Kogu lennuliikluse andmeid

on:
  schedule:
    # Saaremaa bbox pindala on 1.89 sq°, seega /states/all maksab 1 krediidi.
    # 5-minutiline intervall = kuni 288 krediiti päevas, mis mahub ka anonüümsesse 400 limiiti.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Kas kogu uus snapshot või testi ainult Aviationstacki võtit?"
        required: true
        default: collect
        type: choice
        options:
          - collect
          - test

# Vältida sama andmefaili paralleelset pushimist ja sellest tekkivat non-fast-forward viga.
# Kui mitu käivitust koguneb järjekorda, jääb töösse kõige värskem.
concurrency:
  group: flight-data-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fetch:
    if: github.event_name == 'schedule' || inputs.mode == 'collect' || inputs.mode == ''
    runs-on: ubuntu-latest
    steps:
      - name: Laadi hoidla
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Seadista Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kogu uus snapshot
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          AVIATIONSTACK_API_KEY: ${{ secrets.AVIATIONSTACK_API_KEY }}
        run: node scripts/fetch.js
      - name: Salvesta muutunud andmed
        run: |
          if git diff --quiet -- data/flights_24h.json; then
            echo "Andmefailis muudatusi ei ole."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flights_24h.json
          git commit -m "data: uuenda lennuliikluse snapshot"
          git push

  test-aviationstack:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test'
    runs-on: ubuntu-latest
    steps:
      - name: Testi Aviationstacki võtit
        env:
          AVIATIONSTACK_API_KEY: ${{ secrets.AVIATIONSTACK_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$AVIATIONSTACK_API_KEY" ]; then
            echo "::error::AVIATIONSTACK_API_KEY puudub või pole sellele töövoole kättesaadav."
            exit 1
          fi
          response="$(curl -sS -G "https://api.aviationstack.com/v1/flights"             --data-urlencode "access_key=$AVIATIONSTACK_API_KEY"             --data-urlencode "flight_icao=FIN1AB")"
          echo "$response" | jq '{success: (.success // true), matches: (if .data then (.data | length) else 0 end), error: (.error // null)}'
          if echo "$response" | jq -e '.error != null or .success == false' >/dev/null; then
            exit 1
          fi
